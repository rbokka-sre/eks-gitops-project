name: Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build WAR
        run: |
          cd app
          mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build . \
            --file Dockerfile \
            --tag eks-gitops-project:$(date +%s)
