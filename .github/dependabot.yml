version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/app"          # wherever your pom.xml lives
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "maven"
      - "java"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
